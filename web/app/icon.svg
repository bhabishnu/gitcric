<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- No tile: the ball sits on transparency, so it reads as a mark rather than
       a boxed logo. That frees it to fill the canvas (r 14.6 of 16), which is
       what keeps it legible at 16px without a backing shape.
       Colour is red-leather, not the site's #d63c2f accent — a real Kookaburra/
       Dukes ball is far deeper than UI crimson. Anything past ~#8a1a17 starts
       sinking into a dark tab bar at 16px, so this sits at the leathery end of
       what still reads. Seam is warm cream rather than white, as on real leather. -->
  <circle cx="16" cy="16" r="14.6" fill="#a4161a"/>
  <!-- Seam: ONE bold arc. Stitch marks were tried and dropped — at 16px they
       merged into the arc and the ball read as a vertical bar. -->
  <path d="M8.2 5C19.1 9.6 19.1 22.4 8.2 27"
        fill="none" stroke="#f2e8d5" stroke-width="3.3" stroke-linecap="round"/>
</svg>
